    "left_down": 0x0002, "left_up": 0x0004,
    "right_down": 0x0008, "right_up": 0x0010,
    "wheel": 0x0800,
}


def _tap(vk: int, times: int = 1):
    for _ in range(times):
        ctypes.windll.user32.keybd_event(vk, 0, 0, 0)
        ctypes.windll.user32.keybd_event(vk, 0, _KEYEVENTF_KEYUP, 0)


# =============================================================================
# open / close
# =============================================================================
def open_app(name: str) -> str:
    """Launch a *known* app by spoken name. Returns a short status line."""
    key = (name or "").strip().lower()
    target = APPS.get(key)
    if target is None:
        # Only launch apps from the known APPS map (never an arbitrary string).
        return _L(f"{name} tanıdığım uygulamalar arasında yok, açamıyorum.",
                  f"{name} isn't one of my known apps, so I can't open it.")
    try:
        if IS_MAC:
            r = subprocess.run(["open", "-a", target], capture_output=True,
                               text=True, timeout=10)
            if r.returncode != 0:
                return _L(f"{name} açılamadı (yüklü olmayabilir).",
                          f"Couldn't open {name} (it may not be installed).")
        elif IS_WIN:
            if target.endswith(":") or "://" in target:
                os.startfile(target)
            else:
                subprocess.Popen(["cmd", "/c", "start", "", target], shell=False)
        else:
            return _L("Bu sistem desteklenmiyor.", "This system isn't supported.")
        return _L(f"{name} açılıyor.", f"Opening {name}.")
    except Exception as e:
        return _L(f"{name} açılamadı: {e}", f"Couldn't open {name}: {e}")


def close_app(name: str) -> str:
    """Close a running app (destructive — confirm first)."""
    key = (name or "").strip().lower()
    try:
        if IS_MAC:
            target = APPS.get(key)
            if target is None:
                return _L(f"{name} tanıdığım uygulamalar arasında yok.",
                          f"{name} isn't one of my known apps.")
            ok, out = _osa(
                f'if application "{target}" is running then\n'
                f'  tell application "{target}" to quit\n'
                f'  return "yes"\n'
                f'else\n  return "no"\nend if')
            if ok and out == "yes":
                return _L(f"{name} kapatıldı.", f"{name} closed.")
            return _L(f"{name} zaten kapalı görünüyor.",
                      f"{name} looks like it's already closed.")
        image = APPS.get(key, key)
        image = os.path.basename(image)
        if not image.lower().endswith(".exe"):
            image += ".exe"
        r = subprocess.run(["taskkill", "/IM", image, "/F"],
                           capture_output=True, text=True, timeout=10)
        if r.returncode == 0:
            return _L(f"{name} kapatıldı.", f"{name} closed.")
        return _L(f"{name} zaten kapalı görünüyor.",
                  f"{name} looks like it's already closed.")
    except Exception as e:
        return _L(f"{name} kapatılamadı: {e}", f"Couldn't close {name}: {e}")


# =============================================================================
# media / volume
# =============================================================================
def _media_mac(kind: str, amount: int) -> str:
    if kind in ("volume_up", "volume_down"):
        delta = (3 * amount) * (1 if kind == "volume_up" else -1)
        unmute = "set volume output muted false\n" if delta > 0 else ""
        _osa(f"{unmute}set v to (output volume of (get volume settings)) + ({delta})\n"
             f"if v > 100 then set v to 100\nif v < 0 then set v to 0\n"
             f"set volume output volume v")
        return _L("Ses açıldı.", "Volume up.") if delta > 0 else _L("Ses kısıldı.", "Volume down.")
    if kind == "volume_mute":
        _osa("set volume output muted (not (output muted of (get volume settings)))")
        return _L("Ses kapatıldı.", "Muted.")

    # Transport controls: drive Spotify or Apple Music if one is running.
    ok, app = _osa('if application "Spotify" is running then return "Spotify"\n'
                   'if application "Music" is running then return "Music"\n'
                   'return ""')
    if not ok or not app:
        return _L("Spotify veya Müzik uygulaması açık değil, kontrol edemiyorum.",
                  "Neither Spotify nor Music is running, so I can't control playback.")
    cmd = {
        "play_pause": "playpause",
        "next": "next track",
        "prev": "previous track",
        "stop": "pause" if app == "Spotify" else "stop",
    }[kind]
    _osa(f'tell application "{app}" to {cmd}')
    return {
        "play_pause": _L("Oynat/duraklat.", "Play/pause."),
        "next": _L("Sonraki parça.", "Next track."),
        "prev": _L("Önceki parça.", "Previous track."),
        "stop": _L("Durduruldu.", "Stopped."),
    }[kind]


def media(kind: str, amount: int = 4) -> str:
    """Media transport + volume."""
    kind = (kind or "").strip().lower()
    labels = {
        "play_pause": _L("Oynat/duraklat.", "Play/pause."),
        "next": _L("Sonraki parça.", "Next track."),
        "prev": _L("Önceki parça.", "Previous track."),
        "stop": _L("Durduruldu.", "Stopped."),
        "volume_up": _L("Ses açıldı.", "Volume up."),
        "volume_down": _L("Ses kısıldı.", "Volume down."),
        "volume_mute": _L("Ses kapatıldı.", "Muted."),
    }
    if kind not in _VK:
        return _L("Bunu tam anlamadım.", "I didn't quite catch that.")
    if IS_MAC:
        return _media_mac(kind, amount)
    if not IS_WIN:
        return _L("Bu sistem desteklenmiyor.", "This system isn't supported.")
    _tap(_VK[kind], times=amount if "volume" in kind and kind != "volume_mute" else 1)
    return labels.get(kind, _L("Tamam.", "Done."))


# =============================================================================
# power
# =============================================================================
def _power_mac(key: str) -> str:
    if key in ("iptal",):
        if _cancel_pending():
            return _L("İptal edildi.", "Cancelled.")
        return _L("İptal edilecek bir şey yok.", "There's nothing to cancel.")
    if key in ("kapat", "kapatma", "shutdown"):
        _delayed(lambda: _osa('tell application "System Events" to shut down'))
        return _L("30 saniye içinde kapanacak. Vazgeçersen 'iptal et' de.",
                  "Shutting down in 30 seconds. Say 'cancel' to stop it.")
    if key in ("yeniden başlat", "restart"):
        _delayed(lambda: _osa('tell application "System Events" to restart'))
        return _L("30 saniye içinde yeniden başlayacak. Vazgeçersen 'iptal et' de.",
                  "Restarting in 30 seconds. Say 'cancel' to stop it.")
    if key in ("uyku", "sleep"):
        subprocess.Popen(["pmset", "sleepnow"])
        return _L("Tamam.", "Done.")
    if key in ("kilitle", "lock"):
        # Locks if "Require password after sleep/screen saver" is set to immediately.
        subprocess.Popen(["pmset", "displaysleepnow"])
        return _L("Tamam.", "Done.")
    return _L("Bu güç komutunu tanımadım.", "I don't recognize that power command.")


def power(kind: str) -> str:
    """Power actions (destructive — confirm first)."""
    key = (kind or "").strip().lower()
    if key not in _POWER:
        return _L("Bu güç komutunu tanımadım.", "I don't recognize that power command.")
    try:
        if IS_MAC:
            return _power_mac(key)
        if not IS_WIN:
            return _L("Bu sistem desteklenmiyor.", "This system isn't supported.")
        cmd = _POWER[key]
        subprocess.Popen(cmd, shell=False)
        if cmd[0] == "shutdown" and "/s" in cmd:
            return _L("30 saniye içinde kapanacak. Vazgeçersen 'iptal et' de.",
                      "Shutting down in 30 seconds. Say 'cancel' to stop it.")
        if cmd[0] == "shutdown" and "/r" in cmd:
            return _L("30 saniye içinde yeniden başlayacak. Vazgeçersen 'iptal et' de.",
                      "Restarting in 30 seconds. Say 'cancel' to stop it.")
        return _L("Tamam.", "Done.")
    except Exception as e:
        return _L(f"Olmadı: {e}", f"That didn't work: {e}")


# =============================================================================
# mouse (at the current cursor position)
# =============================================================================
def _mouse_mac(kind: str, amount: int) -> str:
    try:
        import Quartz as Q
    except ImportError:
        return _L("Fare kontrolü için: pip install pyobjc-framework-Quartz",
                  "Mouse control needs: pip install pyobjc-framework-Quartz")
    pos = Q.CGEventGetLocation(Q.CGEventCreate(None))

    def click(button, down, up, count=1):
        for i in range(count):
            for etype in (down, up):
                e = Q.CGEventCreateMouseEvent(None, etype, pos, button)
                Q.CGEventSetIntegerValueField(e, Q.kCGMouseEventClickState, i + 1)
                Q.CGEventPost(Q.kCGHIDEventTap, e)

    if kind == "click":
        click(Q.kCGMouseButtonLeft, Q.kCGEventLeftMouseDown, Q.kCGEventLeftMouseUp)
        return _L("Tıkladım.", "Clicked.")
    if kind == "double":
        click(Q.kCGMouseButtonLeft, Q.kCGEventLeftMouseDown, Q.kCGEventLeftMouseUp, 2)
        return _L("Çift tıkladım.", "Double-clicked.")
    if kind == "right":
        click(Q.kCGMouseButtonRight, Q.kCGEventRightMouseDown, Q.kCGEventRightMouseUp)
        return _L("Sağ tıkladım.", "Right-clicked.")
    if kind in ("scroll_down", "scroll_up"):
        lines = 3 * amount * (1 if kind == "scroll_up" else -1)
        e = Q.CGEventCreateScrollWheelEvent(None, Q.kCGScrollEventUnitLine, 1, lines)
        Q.CGEventPost(Q.kCGHIDEventTap, e)
        return _L("Kaydırdım.", "Scrolled.")
    return _L("Bunu tam anlamadım.", "I didn't quite catch that.")


def mouse(kind: str, amount: int = 3) -> str:
    """Basic mouse actions at the current cursor position."""
    kind = (kind or "").strip().lower()
    try:
        if IS_MAC:
            return _mouse_mac(kind, amount)
        if not IS_WIN:
            return _L("Bu sistem desteklenmiyor.", "This system isn't supported.")
        if kind == "click":
            ctypes.windll.user32.mouse_event(_MOUSE["left_down"], 0, 0, 0, 0)
            ctypes.windll.user32.mouse_event(_MOUSE["left_up"], 0, 0, 0, 0)
            return _L("Tıkladım.", "Clicked.")
        if kind == "double":
            for _ in range(2):
                ctypes.windll.user32.mouse_event(_MOUSE["left_down"], 0, 0, 0, 0)
                ctypes.windll.user32.mouse_event(_MOUSE["left_up"], 0, 0, 0, 0)
            return _L("Çift tıkladım.", "Double-clicked.")
        if kind == "right":
            ctypes.windll.user32.mouse_event(_MOUSE["right_down"], 0, 0, 0, 0)
            ctypes.windll.user32.mouse_event(_MOUSE["right_up"], 0, 0, 0, 0)
            return _L("Sağ tıkladım.", "Right-clicked.")
        if kind in ("scroll_down", "scroll_up"):
            delta = 120 * amount * (1 if kind == "scroll_up" else -1)
            ctypes.windll.user32.mouse_event(_MOUSE["wheel"], 0, 0, delta, 0)
            return _L("Kaydırdım.", "Scrolled.")
    except Exception as e:
        return _L(f"Fare işlemi olmadı: {e}", f"Mouse action failed: {e}")
    return _L("Bunu tam anlamadım.", "I didn't quite catch that.")


# =============================================================================
# fullscreen detection (drives auto-tray)
# =============================================================================
# Apps whose windows must never count as "a fullscreen app".
_MAC_IGNORE_OWNERS = {
    "Window Server", "Dock", "Finder", "SystemUIServer", "Control Center",
    "Notification Center", "Spotlight", "loginwindow", "Electron", "E.V.",
}


def _fullscreen_mac() -> bool:
    # Preferred: Quartz window list (fast, no permission needed for bounds).
    try:
        import Quartz as Q
        screen = Q.CGDisplayBounds(Q.CGMainDisplayID())
        sw, sh = screen.size.width, screen.size.height
        opts = Q.kCGWindowListOptionOnScreenOnly | Q.kCGWindowListExcludeDesktopElements
        for w in Q.CGWindowListCopyWindowInfo(opts, Q.kCGNullWindowID) or []:
            if w.get("kCGWindowLayer", 1) != 0:
                continue
            if w.get("kCGWindowOwnerName", "") in _MAC_IGNORE_OWNERS:
                continue
            b = w.get("kCGWindowBounds", {})
            x, y = b.get("X", 1), b.get("Y", 1)
            ww, hh = b.get("Width", 0), b.get("Height", 0)
            # Front-most real app window: fullscreen if it covers the whole display
            # (a normal window never overlaps the menu bar, so y <= 1 is telling).
            return x <= 1 and y <= 1 and ww >= sw - 1 and hh >= sh - 50
        return False
    except ImportError:
        pass
    except Exception:
        return False

    # Fallback: ask System Events (needs Accessibility permission).
    ok, out = _osa(
        'tell application "System Events"\n'
        '  set p to first process whose frontmost is true\n'
        '  try\n'
        '    return (value of attribute "AXFullScreen" of window 1 of p) as string\n'
        '  on error\n    return "false"\n  end try\n'
        'end tell', timeout=3)
    return ok and out.lower() == "true"


def fullscreen_active() -> bool:
    """True if ANY window is fullscreen (game, video, F11 browser, slideshow...)."""
    if IS_MAC:
        return _fullscreen_mac()
    if not IS_WIN:
        return False

    # 1) Notification-state signal (games, exclusive fullscreen, presentations).
    try:
        state = ctypes.c_int(0)
        if ctypes.windll.shell32.SHQueryUserNotificationState(ctypes.byref(state)) == 0:
            if state.value in (2, 3, 4):
                return True
    except Exception:
        pass

    # 2) Foreground window spans the entire primary monitor.
    try:
        u = ctypes.windll.user32
        hwnd = u.GetForegroundWindow()
        if not hwnd:
            return False
        cls = ctypes.create_unicode_buffer(256)
        u.GetClassNameW(hwnd, cls, 256)
        if cls.value in ("Progman", "WorkerW", "Shell_TrayWnd", "Button"):
            return False
        rect = wintypes.RECT()
        u.GetWindowRect(hwnd, ctypes.byref(rect))
        sw = u.GetSystemMetrics(0)
        sh = u.GetSystemMetrics(1)
        if rect.left <= 0 and rect.top <= 0 and rect.right >= sw and rect.bottom >= sh:
            return True
    except Exception:
        pass
    return False


# =============================================================================
# file access (macOS): open folders, find / open / reveal files
# Read-only by design: no delete, move, rename or write.
# =============================================================================
_KNOWN_FOLDERS = {
    "desktop": "~/Desktop", "documents": "~/Documents", "downloads": "~/Downloads",
    "pictures": "~/Pictures", "photos": "~/Pictures", "music": "~/Music",
    "movies": "~/Movies", "videos": "~/Movies", "home": "~",
    "applications": "/Applications",
}
# Never auto-open things that can RUN code; reveal them in Finder instead.
_UNSAFE_EXT = {".app", ".command", ".sh", ".zsh", ".bash", ".pkg", ".dmg", ".scpt",
               ".workflow", ".terminal", ".exe", ".bat", ".jar", ".py", ".pl", ".rb",
               ".js", ".action", ".tool", ".webloc", ".url", ".mpkg", ".iso"}
_SKIP_HOME = ("/Library/", "/.", "/node_modules/", "/venv/", "/.venv/",
              "/site-packages/", "/.Trash/", "/Applications/")
_SKIP_FULL = ("/System/", "/usr/", "/private/", "/Library/Caches/", "/.Trash/",
              "/node_modules/", "/site-packages/", "/.Spotlight", "/.fseventsd")

# Scope: "home" (default) = your home folder, "full" = the whole Mac.
_FILE_SCOPE = {"access": "home", "allow_read": False}


def configure_files(access: str = "home", allow_read: bool = False):
    _FILE_SCOPE["access"] = "full" if str(access).lower() == "full" else "home"
    _FILE_SCOPE["allow_read"] = bool(allow_read)


# Secrets are NEVER opened or read, even with full access — a malicious web page or
# file could otherwise trick the assistant into exposing them.
_SECRET_PARTS = ("/.ssh/", "/.aws/", "/.gnupg/", "/.kube/", "/.config/gcloud",
                 "/.docker/", "/Library/Keychains/", "/Library/Cookies/",
                 "/Library/Safari/", "/Library/Messages/", "/Library/Mail/",
                 "/Library/Application Support/Google/Chrome/",
                 "/Library/Application Support/Firefox/",
                 "/Library/Application Support/MobileSync/")
_SECRET_NAMES = {".env", ".netrc", ".npmrc", ".pypirc", "id_rsa", "id_dsa",
                 "id_ecdsa", "id_ed25519", "login data", "cookies", "cookies.sqlite",
                 "key4.db", "logins.json", "wallet.dat", "credentials"}
_SECRET_EXT = {".pem", ".key", ".p12", ".pfx", ".keychain", ".keychain-db", ".kdbx", ".ovpn"}
_PROJECT_DIR = os.path.dirname(os.path.abspath(__file__))


def is_secret(path: str) -> bool:
    p = os.path.realpath(path)
    low = p.lower()
    base = os.path.basename(low)
    if any(part.lower() in low + "/" for part in _SECRET_PARTS):
        return True
    if base in _SECRET_NAMES or base.startswith(".env") or os.path.splitext(base)[1] in _SECRET_EXT:
        return True
    # E.V.'s own config (holds your API keys)
    if base == "config.json" and os.path.dirname(p) == os.path.realpath(_PROJECT_DIR):
        return True
    return False


def open_folder(name: str) -> str:
    key = (name or "").strip().lower()
    target = _KNOWN_FOLDERS.get(key)
    if not target:
        return _L("Bu klasörü tanımıyorum.", "I don't know that folder.")
    path = os.path.expanduser(target)
    try:
        if IS_MAC:
            subprocess.Popen(["open", path])
        elif IS_WIN:
            os.startfile(path)
        else:
            return _L("Bu sistem desteklenmiyor.", "This system isn't supported.")
        return _L(f"{name} klasörü açılıyor.", f"Opening your {key} folder.")
    except Exception as e:
        return _L(f"Klasör açılamadı: {e}", f"Couldn't open the folder: {e}")


def _search_files(query: str, limit: int = 5):
    """Spotlight filename search (home or whole Mac). Returns a ranked path list."""
    q = (query or "").strip()
    if not q or not IS_MAC:
        return []
    home = os.path.expanduser("~")
    full = _FILE_SCOPE["access"] == "full"
    cmd = ["mdfind", "-name", q] if full else ["mdfind", "-onlyin", home, "-name", q]
    try:
        r = subprocess.run(cmd, capture_output=True, text=True, timeout=15)
    except Exception:
        return []
    skip = _SKIP_FULL if full else _SKIP_HOME
    paths = [x for x in (r.stdout or "").splitlines() if x.strip()]
    paths = [x for x in paths if not any(part in x for part in skip) and not is_secret(x)]
    ql = q.lower()
    favs = tuple(os.path.join(home, d) + os.sep for d in ("Desktop", "Documents", "Downloads"))

    def score(path: str):
        base = os.path.basename(path)
        stem = os.path.splitext(base)[0].lower()
        return (0 if stem == ql else 1 if base.lower().startswith(ql) else 2,
                0 if path.startswith(favs) else 1 if path.startswith(home) else 2,
                len(path))
    paths.sort(key=score)
    return paths[:limit]


_TEXT_EXT = {".txt", ".md", ".markdown", ".csv", ".tsv", ".json", ".log", ".py", ".js",
             ".ts", ".html", ".htm", ".css", ".xml", ".yml", ".yaml", ".ini", ".toml",
             ".swift", ".c", ".h", ".cpp", ".java", ".sh", ".tex", ".srt", ".rtf"}
_TEXTUTIL_EXT = {".docx", ".doc", ".rtf", ".odt", ".html", ".htm"}
READ_LIMIT = 6000


def read_file_text(path: str):
    """Return (ok, text_or_message). Text is capped at READ_LIMIT characters."""
    if is_secret(path):
        return False, _L("Bu dosya gizli bilgiler içerebilir, okumuyorum.",
                         "That file may contain secrets, so I won't read it.")
    ext = os.path.splitext(path)[1].lower()
    try:
        if ext in _TEXTUTIL_EXT and IS_MAC:
            r = subprocess.run(["textutil", "-convert", "txt", "-stdout", path],
                               capture_output=True, text=True, timeout=20)
            text = r.stdout or ""
        elif ext == ".pdf":
            try:
                from pypdf import PdfReader
            except ImportError:
                return False, _L("PDF okumak için: pip install pypdf",
                                 "To read PDFs I need: pip install pypdf")
            reader = PdfReader(path)
            text = "\n".join((pg.extract_text() or "") for pg in reader.pages[:15])
        elif ext in _TEXT_EXT or ext == "":
            with open(path, "rb") as f:
                raw = f.read(200_000)
            text = raw.decode("utf-8", errors="replace")
            if text.count("\ufffd") > max(5, len(text) // 10):
                return False, _L("Bu bir metin dosyasına benzemiyor.",
                                 "That doesn't look like a text file.")
        else:
            return False, _L("Bu dosya türünü okuyamıyorum.", "I can't read that file type.")
    except Exception as e:
        return False, _L(f"Okunamadı: {e}", f"Couldn't read it: {e}")
    text = text.strip()
    if not text:
        return False, _L("Dosya boş görünüyor.", "The file looks empty.")
    return True, text[:READ_LIMIT]


def file_action(payload: str) -> str:
    """payload = 'folder:<name>' | 'find:<query>' | 'open:<query>' | 'reveal:<query>'."""
    kind, _, arg = (payload or "").partition(":")
    kind, arg = kind.strip().lower(), arg.strip()
    if kind == "folder":
        return open_folder(arg)
    if kind not in ("find", "open", "reveal", "read"):
        return _L("Bunu tam anlamadım.", "I didn't quite catch that.")
    if not IS_MAC:
        return _L("Dosya arama şimdilik sadece macOS'ta.", "File search is macOS-only for now.")
    hits = _search_files(arg)
    if not hits:
        return _L(f"'{arg}' adlı bir dosya bulamadım.", f"I couldn't find a file called {arg}.")
    best = hits[0]
    name = os.path.basename(best)
    if kind == "read":
        if not _FILE_SCOPE["allow_read"]:
            return _L("Dosya okuma kapalı. config.json'da allow_file_read: true yap.",
                      "Reading file contents is off. Set allow_file_read to true in config.json.")
        ok, text = read_file_text(best)
        if not ok:
            return text
        return "\x00CONTENT\x00" + f"Contents of the file '{name}':\n\n{text}"
    if kind == "find":
        names = ", ".join(os.path.basename(h) for h in hits[:3])
        where = os.path.basename(os.path.dirname(best))
        return _L(f"{len(hits)} sonuç buldum: {names}. İlki {where} klasöründe.",
                  f"I found {len(hits)} match{'es' if len(hits) > 1 else ''}: {names}. "
                  f"The first is in {where}.")
    try:
        ext = os.path.splitext(best)[1].lower()
        if kind == "reveal" or ext in _UNSAFE_EXT:
            subprocess.Popen(["open", "-R", best])
            if kind == "open" and ext in _UNSAFE_EXT:
                return _L(f"{name} çalıştırılabilir olabilir, o yüzden açmak yerine Finder'da gösterdim.",
                          f"{name} could run code, so I showed it in Finder instead of opening it.")
            return _L(f"{name} Finder'da gösteriliyor.", f"Showing {name} in Finder.")
        subprocess.Popen(["open", best])
        return _L(f"{name} açılıyor.", f"Opening {name}.")
    except Exception as e:
        return _L(f"Açılamadı: {e}", f"Couldn't open it: {e}")


# =============================================================================
# arbitrary commands (destructive — confirm first)
# =============================================================================
def run_command(command: str) -> str:
    """Run an arbitrary shell command (destructive — confirm first)."""
    try:
        r = subprocess.run(command, shell=True, capture_output=True, text=True, timeout=30)
        out = (r.stdout or "").strip() or (r.stderr or "").strip()
        return out[:1500] if out else _L("Komut çalıştı, çıktı yok.", "Command ran, no output.")
    except Exception as e:
        return _L(f"Komut çalışmadı: {e}", f"Command failed: {e}")

