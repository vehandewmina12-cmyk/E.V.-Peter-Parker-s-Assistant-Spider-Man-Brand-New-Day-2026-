# =============================================================================
# macOS helpers
# =============================================================================
def _osa(script: str, timeout: int = 10):
    """Run AppleScript. Returns (ok, stdout_or_stderr)."""
    try:
        r = subprocess.run(["osascript", "-e", script],
                           capture_output=True, text=True, timeout=timeout)
        return r.returncode == 0, (r.stdout or r.stderr or "").strip()
    except Exception as e:
        return False, str(e)


_pending = {"timer": None}


def _delayed(fn, secs: int = 30):
    """Run fn after `secs` seconds; can be cancelled with _cancel_pending()."""
    _cancel_pending()
    t = threading.Timer(secs, fn)
    t.daemon = True
    _pending["timer"] = t
    t.start()


def _cancel_pending() -> bool:
    t = _pending.get("timer")
    if t is not None and t.is_alive():
        t.cancel()
        _pending["timer"] = None
        return True
    return False


